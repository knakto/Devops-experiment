apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
spec:
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.hosts.paths.root.path }}
            pathType: {{ .Values.ingress.hosts.paths.root.type }}
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.port }}
