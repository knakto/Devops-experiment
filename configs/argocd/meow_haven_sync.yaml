apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meow-haven
  namespace: argocd
spec:
  project: default
  source:
    path: configs/helm/meow_haven
    repoURL: "https://github.com/knakto/Devops-experiment.git"
    targetRevision: HEAD
  destination:
    namespace: prod
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
