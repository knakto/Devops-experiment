<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<link href="calc.css" rel="stylesheet" />
</head>

<body>
	<div class="calcForm">
		<h1>Calculator</h1>

		<form id="form" onsubmit="event.preventDefault(); calcForm();">
			<input type="text" id="num1" inputmode="decimal" placeholder="0" required>
			<select id="operator">
				<option value="+">+</option>
				<option value="-">-</option>
				<option value="*">×</option>
				<option value="/">÷</option>
				<option value="%">%</option>
			</select>
			<input type="text" id="num2" inputmode="decimal" placeholder="0" required>
		</form>

		<button type="submit" form="form">Calculate</button>
	</div>

	<script src="calc.js"></script>
</body>

</html>
