<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 150px;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            border: 1px solid #555;
        }
        td:nth-child(1) {
            background-color: #c4c77e;
        }
        td:nth-child(2) {
            background-color: #f6c3ad;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Hello 1 cell</td>
            <td>Hello 2 cell</td>
        </tr>
    </table>
</body>
</html>
